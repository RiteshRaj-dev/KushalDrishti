services:
  # 1. PostGIS Database (Geospatial PostgreSQL for mapping ITI centres)
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: msde_admin
      POSTGRES_PASSWORD: msde_password
      POSTGRES_DB: kushaldrishti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Eclipse Mosquitto (Low-Bandwidth IoT Message Broker)
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # 3. MSDE Central Cloud Backend (FastAPI)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mosquitto
    environment:
      - DATABASE_URL=postgresql://msde_admin:msde_password@db:5432/kushaldrishti
      - MQTT_BROKER=mosquitto
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - shared_notices:/app/notices

  # 4. ITI Edge Simulator (Runs multiple camera nodes testing the broker)
  edge_fleet:
    build: ./edge
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
    volumes:
      - ./edge:/app
      - ./shared:/app/shared

  # 5. MSDE React/HTML Map Dashboard
  dashboard:
    image: nginx:alpine
    ports:
      - "8501:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html

volumes:
  pgdata:
  shared_notices: