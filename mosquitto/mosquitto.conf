# DEMO configuration: plain MQTT, no login. Do NOT deploy like this.
# Production: TLS 1.3 with certificates, one username per centre, and an ACL so a centre can publish
# only to msde/telemetry/<its own code> and msde/evidence/<its own code>/#.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.3
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl
